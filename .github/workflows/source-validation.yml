name: Source validation

on:
  push:
    branches:
      - development-kokoro-app
      - feature/ai-consultation-integration
  pull_request:
    branches:
      - development-kokoro-app

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloud Functions JavaScript syntax
        run: node --check functions/index.js
      - name: Check Service Worker JavaScript syntax
        run: node --check sw.js
      - name: Check inline application JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const html = readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let checked = 0;

          for (let i = 0; i < scripts.length; i += 1) {
            const [, attributes, source] = scripts[i];
            if (/\bsrc\s*=/.test(attributes) || !source.trim()) continue;

            const isModule = /\btype\s*=\s*["']module["']/i.test(attributes);
            const args = isModule ? ['--check', '--input-type=module'] : ['--check'];
            const result = spawnSync(process.execPath, args, {
              input: source,
              encoding: 'utf8'
            });

            if (result.status !== 0) {
              process.stderr.write('Inline script ' + (i + 1) + ' has a syntax error.\n');
              process.stderr.write(result.stderr || result.stdout || '');
              process.exit(result.status || 1);
            }
            checked += 1;
          }

          if (checked === 0) {
            throw new Error('No inline application scripts were found.');
          }
          console.log('Checked ' + checked + ' inline application scripts.');
          NODE
      - name: Validate Firebase wiring and secret handling
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const config = JSON.parse(readFileSync('firebase.json', 'utf8'));
          const project = JSON.parse(readFileSync('.firebaserc', 'utf8'));
          const html = readFileSync('index.html', 'utf8');
          const fn = readFileSync('functions/index.js', 'utf8');

          if (project.projects?.default !== 'kokoro-family') {
            throw new Error('Unexpected default Firebase project.');
          }

          const rewrite = config.hosting?.rewrites?.find(
            item => item.source === '/api/ai-consultation'
          );
          if (rewrite?.function?.functionId !== 'aiConsultation' ||
              rewrite?.function?.region !== 'asia-northeast1') {
            throw new Error('AI consultation Hosting rewrite is missing or inconsistent.');
          }

          if (!fn.includes('defineSecret("OPENAI_API_KEY")') ||
              !fn.includes('secrets: [openAiApiKey]')) {
            throw new Error('AI API key must be provided through Firebase Secret Manager.');
          }
          if (!html.includes('fetch("/api/ai-consultation"')) {
            throw new Error('AI consultation client endpoint is missing.');
          }
          if (/\bsk-[A-Za-z0-9_-]{20,}\b/.test(html)) {
            throw new Error('A possible OpenAI secret key was found in client HTML.');
          }
          console.log('Firebase project, AI rewrite, and server-side secret wiring are consistent.');
          NODE
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('firebase.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('.firebaserc', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('functions/package.json', 'utf8'))"
