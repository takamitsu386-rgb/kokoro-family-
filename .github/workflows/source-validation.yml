name: Source validation

on:
  push:
    branches:
      - development-kokoro-app
      - feature/ai-consultation-integration
  pull_request:
    branches:
      - development-kokoro-app

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloud Functions JavaScript syntax
        run: node --check functions/index.js
      - name: Check Service Worker JavaScript syntax
        run: node --check sw.js
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('firebase.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('.firebaserc', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('functions/package.json', 'utf8'))"
