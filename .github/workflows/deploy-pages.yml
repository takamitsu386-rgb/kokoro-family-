name: Deploy Kokoro Family to GitHub Pages

on:
  push:
    branches:
      - development-kokoro-app
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Prepare static app artifact
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest icon.svg sw.js _site/
          test -s _site/index.html
          test -s _site/manifest.webmanifest
          test -s _site/icon.svg
          test -s _site/sw.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload app files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
