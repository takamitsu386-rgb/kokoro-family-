name: Deploy Kokoro Family to GitHub Pages

on:
  push:
    branches:
      - development-kokoro-app
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # The build only reads source and the existing Pages configuration.
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Prepare static app artifact
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest icon.svg sw.js _site/
          test -s _site/index.html
          test -s _site/manifest.webmanifest
          test -s _site/icon.svg
          test -s _site/sw.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload app files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Only the gated deployment job receives Pages deployment and OIDC permissions.
    permissions:
      pages: write
      id-token: write
    # Require an explicit manual dispatch from the release branch and release approval.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/development-kokoro-app' && vars.KOKORO_PUBLIC_RELEASE_APPROVED == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
